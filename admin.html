<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odeleye Research — Editor</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><header class="mast"><div><h1>Editor</h1><p>Private publication desk · Odeleye Research</p></div><a class="mono" href="index.html">VIEW PUBLICATION →</a></header><main class="admin-wrap"><section id="auth" class="admin-panel"><h2>Editor sign in</h2><p>Use the Supabase Auth account you created for the publication.</p><form id="login"><input id="email" type="email" required placeholder="EMAIL"><input id="password" type="password" required placeholder="PASSWORD"><button> SIGN IN → </button><div id="auth-msg"></div></form></section><section id="dashboard" hidden><div class="admin-panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><h2>Publication desk</h2><button id="logout">SIGN OUT</button></div><p id="userline" class="date"></p></div><div class="admin-panel"><h2 id="editor-title">New publication</h2><form id="article-form"><input type="hidden" id="article-id"><div class="admin-grid"><div><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Subtitle / deck<input id="subtitle"></label><label>Excerpt<textarea id="excerpt" style="min-height:120px"></textarea></label></div><div><label>Category<select id="category"><option>Research</option><option>Health</option><option>Technology</option><option>Opinion</option><option>Field Notes</option><option>Data</option></select></label><label>Cover image URL<input id="cover"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div></div><label>Article HTML<textarea id="content" required placeholder="Write your article here. You may use basic HTML such as <p>, <h2>, <strong>, <em>, <ul>, <li>, and <img>."></textarea></label><button>SAVE PUBLICATION →</button><button type="button" id="reset">NEW / CLEAR</button><span id="save-msg"></span></form></div><div class="admin-panel"><h2>Publications</h2><div id="articles" class="admin-list"></div></div><div class="admin-panel"><h2>Comment moderation</h2><div id="comments" class="admin-list"></div></div></section></main><script src="admin.js"></script></body></html>
